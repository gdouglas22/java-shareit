services:
  postgres:
    image: postgres:16
    container_name: shareit-postgres
    environment:
      POSTGRES_USER: shareit
      POSTGRES_PASSWORD: shareit
      POSTGRES_DB: shareit
    ports:
      - "5432:5432"
    volumes:
      - shareit_pgdata:/var/lib/postgresql/data

volumes:
  shareit_pgdata:
